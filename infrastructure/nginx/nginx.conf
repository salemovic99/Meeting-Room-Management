worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 2m;

  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';
  # Log $uri (no query string) so nothing sensitive in query params lands in logs.
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  # Admin dashboard: restrict to corporate networks / VPN. Adjust to your ranges.
  # TV display pages (/display/*) and their APIs stay reachable from the TV VLAN.
  geo $admin_allowed {
    default 0;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    127.0.0.1/32 1;
  }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/auth/login {
      if ($admin_allowed = 0) { return 403; }
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend;
    }

    # TV-facing endpoints (device-authenticated, read-only).
    location /api/v1/display/ { proxy_pass http://backend; }
    location /api/v1/health   { proxy_pass http://backend; }

    location /api/ {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://backend;
    }

    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;   # clients ping every 30s
      proxy_send_timeout 120s;
    }

    location /display/ { proxy_pass http://frontend; }
    location /_next/   { proxy_pass http://frontend; }

    # Dashboard + the QR walk-up booking page (/book/<slug>): phones must be on corporate Wi-Fi/VPN.
    location / {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://frontend;
    }
  }
}
